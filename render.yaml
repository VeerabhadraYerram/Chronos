# Free-only evaluation. No paid database, disk, or persistent-memory claim.
services:
  - type: web
    name: chronosgraph
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: "8000"
      - key: CHRONOS_COMPANY_GRAPH
        value: chronos_delhivery_reference_v1
      - key: CHRONOS_MAX_SESSIONS
        value: "6"
      - key: CHRONOS_SESSION_TTL_SECONDS
        value: "3600"
      - key: CHRONOS_EPHEMERAL
        value: "1"
      - key: CHRONOS_AI_BUDGET_SECONDS
        value: "75"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: OPENROUTER_MODEL
        value: openrouter/free
