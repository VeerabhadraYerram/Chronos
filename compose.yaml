services:
  falkordb:
    image: falkordb/falkordb:v4.22.1@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    container_name: chronosgraph-db
    ports:
      - "127.0.0.1:6389:6379"
    volumes:
      - chronosgraph-data:/var/lib/falkordb/data
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
      BROWSER: "0"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  chronosgraph-data:
    name: chronosgraph-data
