name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Real FalkorDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
        env:
          BROWSER: "0"
          REDIS_ARGS: "--appendonly no"
        ports:
          - 6389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PYTHONPATH: backend
      FALKOR_HOST: 127.0.0.1
      FALKOR_PORT: "6389"
      FALKOR_GRAPH: chronos_ci
      GEMINI_API_KEY: ""
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Test against the real graph database
        run: python -m pytest backend/tests -q
      - name: Evaluate the isolated business scenario
        run: python scripts/evaluate.py

  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.6"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned dependencies
        run: npm --prefix frontend ci
      - name: Check graph label placement
        run: npm --prefix frontend test
      - name: Check types and build
        run: npm --prefix frontend run build

  documentation:
    name: Documentation links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify local links and media
        run: python scripts/check_docs.py
